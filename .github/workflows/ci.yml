name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps . -w dist
      - run: python -m venv /tmp/wheel-env && /tmp/wheel-env/bin/pip install dist/*.whl
      - run: /tmp/wheel-env/bin/model-pin-scanner data
      - run: /tmp/wheel-env/bin/model-pin-scanner scan tests/fixtures/clean_repo --fail-within 30

  action-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean repo passes
        uses: ./
        with:
          path: tests/fixtures/clean_repo
          fail-within-days: "30"
      - name: Sample repo fails
        id: sample
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/sample_repo
          fail-within-days: "36500"
      - name: Check the sample repo failed
        env:
          OUTCOME: ${{ steps.sample.outcome }}
          FAILING: ${{ steps.sample.outputs.failing }}
        run: |
          test "$OUTCOME" = "failure"
          test "$FAILING" -gt 0
