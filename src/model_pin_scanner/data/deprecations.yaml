# Known LLM model shutdowns. One entry per model ID.
#
# Fields:
#   id              exact model ID the provider serves (usually a dated snapshot)
#   provider        openai | anthropic | google | other
#   shutdown_date   YYYY-MM-DD, the date the provider stops serving the model
#   replacement     provider's recommended replacement, or null if not confirmed
#   source_url      the provider's official deprecations page for this entry
#   verified        true only when the entry was checked directly against source_url
#   aliases         other IDs that resolve to this model and stop with it
#   notes           free text: conflicts, caveats, how the entry was sourced
#
#   verified_by     official source the entry was checked against when source_url
#                   could not be reached (optional; only on verified entries)
#
# Last reviewed 2026-11-22. The official docs pages could not be fetched from the
# build sandbox. Anthropic dates are confirmed in Anthropic's own SDK, which ships
# a deprecation table (verified_by links it). Every other entry is verified: false:
# upcoming OpenAI and Google shutdowns come from web search results that quote the
# pages and from secondary trackers, and the "already retired" blocks come from
# training knowledge. See DECISIONS.md before relying on any date.
