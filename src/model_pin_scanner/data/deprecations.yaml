# Known LLM model shutdowns. One entry per model; IDs that stop with it are aliases.
#
# Fields:
#   id              exact model ID the provider serves (usually a dated snapshot)
#   provider        openai | anthropic | google | other
#   shutdown_date   YYYY-MM-DD, the date the provider stops serving the model (for Google,
#                   the earliest possible shutdown date it publishes)
#   replacement     provider's recommended replacement, or null if none is given
#   source_url      the provider's official deprecations page for this entry
#   verified        true when the entry was checked against source_url (or verified_by)
#   verified_by     official source the entry was checked against when it is not on
#                   source_url (optional; only on verified entries)
#   aliases         other IDs that resolve to this model and stop with it
#   notes           free text: caveats, routing, how the entry was sourced
#
# Last reviewed 2026-11-22: every entry was rebuilt from the three official pages, which
# were read directly that day. The only unverified entries are five Gemini 1.5 models
# that Google's page no longer lists. See DECISIONS.md.
