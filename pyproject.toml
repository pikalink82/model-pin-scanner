[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "model-pin-scanner"
version = "0.1.0"
description = "Find pinned LLM model IDs close to shutdown, and diff outputs across model upgrades."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pikalink" }]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
keywords = ["llm", "openai", "anthropic", "gemini", "deprecation", "ci"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
model-pin-scanner = "model_pin_scanner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_pin_scanner"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "action.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
